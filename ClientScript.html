<script>
  const ROLL_NUMBER_PATTERN = /^CB\.SC\.U4[A-Z]{3}\d{2}\d{3}$/;
  const DEVICE_STORAGE_KEY = 'brig_device_id';
  const ATTENDANCE_RECEIPT_PREFIX = 'brig_attended_';
  const BUTTON_LABELS = {
    continue: 'Continue securely',
    confirm: 'Confirm attendance',
    register: 'Register and check in'
  };

  const state = {
    sessionToken: '',
    accessCode: '',
    accessExpires: '',
    accessGrant: '',
    rollNumber: '',
    fullName: '',
    deviceId: getOrCreateDeviceId()
  };

  const views = {
    loading: document.getElementById('view-loading'),
    invalid: document.getElementById('view-invalid'),
    rollInput: document.getElementById('view-roll-input'),
    confirm: document.getElementById('view-confirm'),
    register: document.getElementById('view-register'),
    success: document.getElementById('view-success')
  };

  const elements = {
    invalidReason: document.getElementById('invalid-reason'),
    clubTitle: document.getElementById('club-title'),
    sessionTitle: document.getElementById('session-title'),
    sessionDate: document.getElementById('session-date'),
    formRoll: document.getElementById('form-roll'),
    rollNumber: document.getElementById('rollNumber'),
    rollError: document.getElementById('roll-error'),
    btnRollContinue: document.getElementById('btn-roll-continue'),
    confirmAvatar: document.getElementById('confirm-avatar'),
    confirmName: document.getElementById('confirm-name'),
    confirmRoll: document.getElementById('confirm-roll'),
    formConfirm: document.getElementById('form-confirm'),
    confirmError: document.getElementById('confirm-error'),
    btnConfirmAttendance: document.getElementById('btn-confirm-attendance'),
    btnConfirmBack: document.getElementById('btn-confirm-back'),
    formRegister: document.getElementById('form-register'),
    regRollNumber: document.getElementById('regRollNumber'),
    regFullName: document.getElementById('regFullName'),
    registerError: document.getElementById('register-error'),
    btnRegisterAttendance: document.getElementById('btn-register-attendance'),
    btnRegisterBack: document.getElementById('btn-register-back'),
    successMessage: document.getElementById('success-message')
  };

  function createUuid() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }

    const bytes = new Uint8Array(16);
    window.crypto.getRandomValues(bytes);
    bytes[6] = (bytes[6] & 0x0f) | 0x40;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    const hex = Array.from(bytes, byte => byte.toString(16).padStart(2, '0'));
    return `${hex.slice(0, 4).join('')}-${hex.slice(4, 6).join('')}-${hex.slice(6, 8).join('')}-${hex.slice(8, 10).join('')}-${hex.slice(10).join('')}`;
  }

  function getOrCreateDeviceId() {
    try {
      let deviceId = localStorage.getItem(DEVICE_STORAGE_KEY);
      if (!deviceId || !/^[a-f0-9-]{36}$/i.test(deviceId)) {
        deviceId = createUuid();
        localStorage.setItem(DEVICE_STORAGE_KEY, deviceId);
      }
      return deviceId;
    } catch (error) {
      return '';
    }
  }

  function hasAttendanceReceipt() {
    if (!state.sessionToken) return false;
    try {
      return localStorage.getItem(ATTENDANCE_RECEIPT_PREFIX + state.sessionToken) === 'recorded';
    } catch (error) {
      return false;
    }
  }

  function saveAttendanceReceipt() {
    try {
      localStorage.setItem(ATTENDANCE_RECEIPT_PREFIX + state.sessionToken, 'recorded');
    } catch (error) {
      // The server-side roll and device checks remain authoritative.
    }
  }

  function showView(viewName) {
    Object.values(views).forEach(view => {
      view.classList.remove('active');
      view.classList.add('hidden');
    });
    views[viewName].classList.remove('hidden');
    views[viewName].classList.add('active');
  }

  function showError(element, message) {
    element.textContent = message;
    element.classList.remove('hidden');
  }

  function hideError(element) {
    element.textContent = '';
    element.classList.add('hidden');
  }

  function setButtonLoading(button, isLoading, label) {
    button.disabled = isLoading;
    button.classList.toggle('is-loading', isLoading);
    button.textContent = isLoading ? 'Please wait' : label;
  }

  function failureMessage(error) {
    return error && error.message ? error.message : 'Unable to reach the server. Please try again.';
  }

  function resetIdentity() {
    state.rollNumber = '';
    state.fullName = '';
    elements.rollNumber.value = '';
    elements.regFullName.value = '';
    hideError(elements.rollError);
    showView('rollInput');
    elements.rollNumber.focus();
  }

  function submitAttendance(isNewRegistration, errorElement, button, label) {
    if (!state.deviceId) {
      showError(errorElement, 'Browser storage is disabled. Enable it or use a standard browser window, then try again.');
      return;
    }
    if (hasAttendanceReceipt()) {
      showError(errorElement, 'Attendance has already been submitted from this browser for this session.');
      return;
    }

    setButtonLoading(button, true, label);
    google.script.run
      .withSuccessHandler(response => {
        setButtonLoading(button, false, label);
        handleAttendanceResponse(response, errorElement);
      })
      .withFailureHandler(error => {
        setButtonLoading(button, false, label);
        showError(errorElement, failureMessage(error));
      })
      .submitAttendance(
        state.sessionToken,
        state.rollNumber,
        state.fullName,
        isNewRegistration,
        state.deviceId,
        navigator.userAgent,
        state.accessGrant
      );
  }

  function handleAttendanceResponse(response, errorElement) {
    if (response.success || response.duplicate) {
      saveAttendanceReceipt();
      if (response.duplicate) {
        const recordedAt = new Date(response.time).toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit'
        });
        elements.successMessage.textContent = `Attendance was already recorded at ${recordedAt}.`;
      }
      showView('success');
      createCelebration();
      return;
    }

    if (response.deviceBlocked) {
      saveAttendanceReceipt();
      elements.invalidReason.textContent = response.error;
      showView('invalid');
      return;
    }

    showError(errorElement, response.error || 'Attendance could not be recorded.');
  }

  function createCelebration() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const colors = ['#46c7b5', '#f3b35b', '#f7f7f2'];
    for (let index = 0; index < 28; index++) {
      const particle = document.createElement('span');
      particle.className = 'celebration-particle';
      particle.style.setProperty('--x', `${(Math.random() - 0.5) * 520}px`);
      particle.style.setProperty('--y', `${120 + Math.random() * 380}px`);
      particle.style.setProperty('--rotation', `${Math.random() * 720}deg`);
      particle.style.setProperty('--delay', `${Math.random() * 0.18}s`);
      particle.style.background = colors[index % colors.length];
      document.body.appendChild(particle);
      window.setTimeout(() => particle.remove(), 1800);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const serverSessionToken = document.body.dataset.sessionToken;
    state.accessCode = document.body.dataset.accessCode || urlParams.get('access') || '';
    state.accessExpires = document.body.dataset.accessExpires || urlParams.get('expires') || '';
    state.sessionToken = serverSessionToken
      ? serverSessionToken
      : urlParams.get('session');

    if (!state.sessionToken) {
      elements.invalidReason.textContent = 'No attendance session was provided in this link.';
      showView('invalid');
      return;
    }

    google.script.run
      .withSuccessHandler(response => {
        if (!response.valid) {
          elements.invalidReason.textContent = response.reason;
          showView('invalid');
          return;
        }

        elements.clubTitle.textContent = `${response.clubName || 'B-RIG'} check-in`;
        elements.sessionTitle.textContent = response.title || 'Attendance session';
        elements.sessionDate.textContent = response.date || '';
        state.accessGrant = response.accessGrant;
        if (hasAttendanceReceipt()) {
          elements.successMessage.textContent = 'Attendance has already been submitted from this browser for this session.';
          showView('success');
          return;
        }
        showView('rollInput');
        elements.rollNumber.focus();
      })
      .withFailureHandler(error => {
        elements.invalidReason.textContent = failureMessage(error);
        showView('invalid');
      })
      .getClientSessionDetails(
        state.sessionToken,
        state.accessCode,
        state.accessExpires,
        state.deviceId
      );
  });

  elements.rollNumber.addEventListener('input', event => {
    event.target.value = event.target.value.toUpperCase().replace(/\s/g, '').slice(0, 16);
    hideError(elements.rollError);
  });

  elements.formRoll.addEventListener('submit', event => {
    event.preventDefault();
    hideError(elements.rollError);

    const rollNumber = elements.rollNumber.value.trim().toUpperCase();
    if (!ROLL_NUMBER_PATTERN.test(rollNumber)) {
      showError(elements.rollError, 'Use CB.SC.U4CYS25048 format: 3 department letters, 2 joining-year digits, and 3 roll digits.');
      elements.rollNumber.focus();
      return;
    }

    state.rollNumber = rollNumber;
    setButtonLoading(elements.btnRollContinue, true, BUTTON_LABELS.continue);
    google.script.run
      .withSuccessHandler(response => {
        setButtonLoading(elements.btnRollContinue, false, BUTTON_LABELS.continue);
        if (!response.valid) {
          showError(elements.rollError, response.error);
          return;
        }

        state.rollNumber = response.rollNumber;
        if (response.exists) {
          state.fullName = response.fullName;
          elements.confirmName.textContent = response.fullName;
          elements.confirmRoll.textContent = response.rollNumber;
          elements.confirmAvatar.textContent = response.fullName.charAt(0).toUpperCase();
          showView('confirm');
          return;
        }

        elements.regRollNumber.value = response.rollNumber;
        elements.regFullName.value = '';
        showView('register');
        elements.regFullName.focus();
      })
      .withFailureHandler(error => {
        setButtonLoading(elements.btnRollContinue, false, BUTTON_LABELS.continue);
        showError(elements.rollError, failureMessage(error));
      })
      .validateRollNo(rollNumber, state.sessionToken, state.deviceId, state.accessGrant);
  });

  elements.btnConfirmBack.addEventListener('click', resetIdentity);
  elements.btnRegisterBack.addEventListener('click', resetIdentity);

  elements.formConfirm.addEventListener('submit', event => {
    event.preventDefault();
    hideError(elements.confirmError);
    submitAttendance(false, elements.confirmError, elements.btnConfirmAttendance, BUTTON_LABELS.confirm);
  });

  elements.formRegister.addEventListener('submit', event => {
    event.preventDefault();
    hideError(elements.registerError);

    const fullName = elements.regFullName.value.trim().replace(/\s+/g, ' ');
    if (fullName.length < 2) {
      showError(elements.registerError, 'Enter your full official name.');
      elements.regFullName.focus();
      return;
    }

    state.fullName = fullName;
    submitAttendance(true, elements.registerError, elements.btnRegisterAttendance, BUTTON_LABELS.register);
  });
</script>
