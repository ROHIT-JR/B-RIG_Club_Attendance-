<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B-RIG Check-in Redirect</title>
    <style>
        body {
            background-color: #0f0f14;
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #00ffcc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div>
        <div class="loader"></div>
        <h2>Opening Secure Session...</h2>
        <p style="color: #aaa; font-size: 14px;">B-RIG Attendance System</p>
    </div>

    <script>
        // Parse the URL to get the target script.google.com link
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('url');

        if (targetUrl && targetUrl.startsWith('https://script.google.com/')) {
            // Replace the current location, preventing Android App Link interception
            window.location.replace(targetUrl);
        } else {
            document.querySelector('h2').innerText = "Invalid Session Link";
            document.querySelector('.loader').style.display = 'none';
        }
    </script>
</body>
</html>
