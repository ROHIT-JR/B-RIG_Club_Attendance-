<style>
  :root {
    --accent: #248888;
    --accent-glow: rgba(36, 136, 136, 0.6);
    --secondary: #ff3b00;
    --text-main: #ffffff;
    --text-muted: #a1a1aa;
    --error: #f87171;
    --success: #34d399;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    color: var(--text-main);
    display: block;
    min-height: 100vh;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
    background-color: #000;
    overflow-x: hidden;
    overflow-y: auto;
  }

  /* --- Ambient Aurora Background --- */
  .app-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: #000;
    overflow: hidden;
  }

  .aurora {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    animation: drift 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
  }

  .aurora-1 {
    width: 60vw;
    height: 60vw;
    background: var(--accent);
    top: -10vw;
    left: -10vw;
  }

  .aurora-2 {
    width: 50vw;
    height: 50vw;
    background: var(--secondary);
    bottom: -10vw;
    right: -10vw;
    animation-delay: -7s;
  }
  
  .aurora-3 {
    width: 40vw;
    height: 40vw;
    background: #114b5f;
    top: 30vh;
    left: 40vw;
    animation-delay: -14s;
  }

  .noise-overlay {
    position: absolute;
    inset: 0;
    opacity: 0.25;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    mix-blend-mode: overlay;
  }

  @keyframes drift {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(15vw, 15vh) scale(1.3); }
  }

  /* --- Cinematic Splash Sequence --- */
  .splash-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background-color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: splashDismiss 0.8s cubic-bezier(0.85, 0, 0.15, 1) 4.8s forwards;
  }

  @keyframes splashDismiss {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.1); visibility: hidden; pointer-events: none; }
  }

  .splash-step {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 1. Spinner (0 - 0.8s) */
  .splash-step-1 {
    animation: fadeOutStep 0.4s ease 0.8s forwards;
  }

  /* 2. Logo & Brand (0.8s - 3.2s) */
  .splash-step-2 {
    opacity: 0;
    animation: sequenceStep2 2.4s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
  }

  @keyframes sequenceStep2 {
    0% { opacity: 0; transform: translateY(15px) scale(0.95); filter: blur(10px); }
    15% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); } /* 0.8 + 0.36 = 1.16s */
    85% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); } /* 0.8 + 2.04 = 2.84s */
    100% { opacity: 0; transform: translateY(-15px) scale(1.05); filter: blur(10px); } /* 0.8 + 2.4 = 3.2s */
  }

  /* 3. Welcome Text (3.2s - 4.8s) */
  .splash-step-3 {
    opacity: 0;
    animation: sequenceStep3 1.6s cubic-bezier(0.16, 1, 0.3, 1) 3.2s forwards;
  }

  @keyframes sequenceStep3 {
    0% { opacity: 0; transform: translateY(10px); letter-spacing: 0px; filter: blur(10px); }
    25% { opacity: 1; transform: translateY(0); letter-spacing: 3px; filter: blur(0px); }
    85% { opacity: 1; transform: translateY(0); letter-spacing: 4px; filter: blur(0px); }
    100% { opacity: 0; transform: translateY(-10px); filter: blur(5px); }
  }

  @keyframes fadeOutStep {
    to { opacity: 0; visibility: hidden; }
  }

  .splash-logo {
    width: 140px;
    height: 140px;
    border-radius: 28px;
    box-shadow: 0 0 50px rgba(36, 136, 136, 0.3);
    margin-bottom: 24px;
    animation: float 4s ease-in-out infinite;
  }

  .splash-brand {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 8px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .splash-welcome {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .futuristic-spinner {
    width: 50px;
    height: 50px;
    border: 2px solid rgba(255, 255, 255, 0.05);
    border-top-color: var(--accent);
    border-right-color: rgba(36, 136, 136, 0.5);
    border-radius: 50%;
    animation: spin 1s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* --- Main App UI (Glassmorphism) --- */
  .app-container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 420px;
    margin: 4vh auto 40px auto;
    background: rgba(15, 15, 20, 0.4);
    border-radius: 32px;
    padding: 40px 32px;
    box-shadow: 
      0 40px 80px rgba(0, 0, 0, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, 0.15),
      inset 0 0 20px rgba(255, 255, 255, 0.02);
    border: 0.5px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(40px) saturate(150%);
    -webkit-backdrop-filter: blur(40px) saturate(150%);
    
    /* Entrance Animation */
    opacity: 0;
    transform: scale(0.95) translateY(20px);
    animation: appEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) 4.6s forwards;
  }

  @keyframes appEntrance {
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .app-header-logo {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }

  .app-header-logo img {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.3);
  }

  /* Views */
  .view {
    display: none;
    flex-direction: column;
    animation: viewFade 0.4s ease;
  }

  .view.active {
    display: flex;
  }

  .view.hidden {
    display: none;
  }

  @keyframes viewFade {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Typography */
  .title {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
    text-align: center;
  }

  .subtitle {
    font-size: 15px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 32px;
    line-height: 1.5;
  }

  /* Forms */
  .form-group {
    margin-bottom: 24px;
    display: flex;
    flex-direction: column;
  }

  label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
    color: rgba(255,255,255,0.5);
  }

  input[type="text"] {
    width: 100%;
    padding: 18px 24px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    font-size: 16px;
    color: #fff;
    font-weight: 500;
    letter-spacing: 0.5px;
    outline: none;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
  }

  input[type="text"]:focus {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(36, 136, 136, 0.6);
    box-shadow: 
      inset 0 2px 4px rgba(0,0,0,0.2),
      0 0 0 4px rgba(36, 136, 136, 0.15);
    transform: translateY(-2px);
  }
  
  input[type="text"]::placeholder {
    color: rgba(255,255,255,0.2);
  }

  .input-locked {
    background: rgba(0,0,0,0.2) !important;
    color: var(--text-muted) !important;
    cursor: not-allowed;
    border-color: rgba(255,255,255,0.02) !important;
    box-shadow: none !important;
    transform: none !important;
  }

  /* Buttons */
  button {
    width: 100%;
    padding: 18px 24px;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    border: none;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
  }

  .btn-primary {
    background: linear-gradient(180deg, #2a9d9d 0%, #1e7070 100%);
    color: #fff;
    box-shadow: 
      0 8px 16px rgba(36, 136, 136, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
    margin-bottom: 16px;
  }

  .btn-primary:hover:not(:disabled) {
    transform: scale(1.02) translateY(-2px);
    box-shadow: 
      0 12px 24px rgba(36, 136, 136, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  .btn-primary:active:not(:disabled) {
    transform: scale(0.96);
  }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.05);
    color: #d1d5db;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .btn-secondary:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    transform: scale(1.02);
  }

  .btn-secondary:active:not(:disabled) {
    transform: scale(0.96);
  }

  /* Profile Card */
  .profile-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 24px;
    display: flex;
    align-items: center;
    margin-bottom: 32px;
    backdrop-filter: blur(10px);
  }

  .profile-avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent) 0%, #114b5f 100%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    font-weight: 700;
    margin-right: 20px;
    box-shadow: 
      0 8px 16px rgba(36, 136, 136, 0.3),
      inset 0 2px 4px rgba(255,255,255,0.2);
  }

  .profile-details {
    display: flex;
    flex-direction: column;
  }

  .profile-name {
    font-size: 20px;
    font-weight: 600;
    color: white;
  }

  .profile-roll {
    font-size: 15px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* Status Icons */
  .icon-circle {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 32px auto;
  }

  .icon-circle svg {
    width: 44px;
    height: 44px;
  }

  .success-bg {
    background: rgba(52, 211, 153, 0.1);
    color: var(--success);
    border: 1px solid rgba(52, 211, 153, 0.2);
    box-shadow: 0 0 40px rgba(52, 211, 153, 0.2);
  }

  .error-bg {
    background: rgba(248, 113, 113, 0.1);
    color: var(--error);
    border: 1px solid rgba(248, 113, 113, 0.2);
    box-shadow: 0 0 40px rgba(248, 113, 113, 0.2);
  }

  .error-text {
    color: #ff8a8a;
    font-size: 14px;
    margin-bottom: 24px;
    text-align: center;
    background-color: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.2);
    padding: 14px;
    border-radius: 12px;
  }

  /* Animated Checkmark */
  .checkmark-animated {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: block;
    stroke-width: 3.5;
    stroke: var(--success);
    stroke-miterlimit: 10;
    box-shadow: inset 0px 0px 0px var(--success);
    animation: checkFill .4s ease-in-out .4s forwards, checkScale .3s ease-in-out .9s both, successGlow 2s infinite alternate;
    margin: 0 auto;
  }

  .checkmark-circle {
    stroke-dasharray: 166;
    stroke-dashoffset: 166;
    stroke-width: 3.5;
    stroke-miterlimit: 10;
    stroke: var(--success);
    fill: none;
    animation: checkStroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
  }

  .checkmark-check {
    transform-origin: 50% 50%;
    stroke-dasharray: 48;
    stroke-dashoffset: 48;
    animation: checkStroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
  }

  @keyframes checkStroke {
    100% { stroke-dashoffset: 0; }
  }
  @keyframes checkScale {
    0%, 100% { transform: none; }
    50% { transform: scale3d(1.15, 1.15, 1); }
  }
  @keyframes checkFill {
    100% { box-shadow: inset 0px 0px 0px 50px rgba(52, 211, 153, 0.15); }
  }
  @keyframes successGlow {
    from { filter: drop-shadow(0 0 15px rgba(52, 211, 153, 0.2)); }
    to { filter: drop-shadow(0 0 40px rgba(52, 211, 153, 0.5)); }
  }

  /* Coin Confetti Blast */
  .coin-confetti {
    position: fixed;
    width: var(--size, 60px);
    height: var(--size, 60px);
    border-radius: 50%;
    pointer-events: none;
    z-index: 5; /* Lower than app container (10) to fall behind it */
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5), inset 0 0 5px rgba(255, 255, 255, 0.3);
    animation: coinBlast forwards cubic-bezier(0.25, 1, 0.5, 1);
    will-change: transform, opacity;
  }

  @keyframes coinBlast {
    0% {
      transform: translate(var(--start-x), var(--start-y)) scale(0.1) rotate(0deg);
      opacity: 1;
    }
    40% {
      /* Midpoint of flight */
      transform: translate(var(--mid-x), var(--mid-y)) scale(1) rotate(var(--rot-mid));
      opacity: 1;
    }
    100% {
      /* Resting at the bottom, responsive to gravity tilt */
      transform: translate(calc(var(--end-x) + var(--tilt-x, 0px)), calc(var(--end-y) + var(--tilt-y, 0px))) scale(1) rotate(var(--rot-end));
      opacity: 1;
    }
  }
</style>
