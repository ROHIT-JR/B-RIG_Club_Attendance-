<style>
  :root {
    --bg: #061110;
    --surface: rgba(12, 31, 29, 0.88);
    --surface-raised: rgba(19, 43, 40, 0.84);
    --border: rgba(194, 232, 225, 0.13);
    --border-strong: rgba(194, 232, 225, 0.23);
    --primary: #46c7b5;
    --primary-dark: #238b7e;
    --accent: #f3b35b;
    --text: #f7f7f2;
    --muted: #9bb0ac;
    --error: #ff8f88;
    --success: #6ad7a8;
    --shadow: 0 30px 80px rgba(0, 0, 0, 0.44);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    min-height: 100%;
    background: var(--bg);
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding: max(20px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
    overflow-x: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  button,
  input {
    font: inherit;
  }

  .page-background {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .grid-pattern {
    position: absolute;
    inset: 0;
    opacity: 0.22;
    background-image:
      linear-gradient(rgba(119, 193, 181, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(119, 193, 181, 0.07) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: linear-gradient(to bottom, black, transparent 85%);
  }

  .glow {
    position: absolute;
    width: min(70vw, 680px);
    aspect-ratio: 1;
    border-radius: 50%;
    filter: blur(110px);
    opacity: 0.17;
  }

  .glow-primary {
    top: -30%;
    left: -16%;
    background: var(--primary);
  }

  .glow-secondary {
    right: -25%;
    bottom: -35%;
    background: var(--accent);
  }

  .page-shell {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
  }

  .brand-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin: 4px 4px 22px;
  }

  .brand-identity {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-logo {
    width: 44px;
    height: 44px;
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
  }

  .brand-name {
    font-family: 'Manrope', sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.14em;
  }

  .brand-caption {
    margin-top: 1px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.04em;
  }

  .secure-badge,
  .success-footer {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: #b9ccc8;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 0 4px rgba(106, 215, 168, 0.1), 0 0 14px rgba(106, 215, 168, 0.5);
  }

  .app-card {
    min-height: 430px;
    padding: clamp(28px, 7vw, 42px);
    border: 1px solid var(--border);
    border-radius: 28px;
    background: linear-gradient(145deg, rgba(17, 39, 37, 0.94), var(--surface));
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }

  .view {
    display: none;
  }

  .view.active {
    display: block;
    animation: view-enter 280ms ease-out;
  }

  .view.hidden {
    display: none;
  }

  @keyframes view-enter {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .loading-view,
  .status-view {
    padding: 62px 0 40px;
    text-align: center;
  }

  .loader {
    width: 42px;
    height: 42px;
    margin: 0 auto 28px;
    border: 3px solid rgba(70, 199, 181, 0.13);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 800ms linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .section-heading {
    margin-bottom: 25px;
  }

  .eyebrow {
    margin-bottom: 9px;
    color: var(--primary);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .success-eyebrow {
    color: var(--success);
  }

  .title {
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: clamp(27px, 7vw, 34px);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.14;
  }

  .subtitle {
    margin-top: 10px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }

  .session-panel {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 26px;
    padding: 15px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: rgba(5, 18, 17, 0.38);
  }

  .session-icon {
    display: grid;
    flex: 0 0 40px;
    width: 40px;
    height: 40px;
    place-items: center;
    border-radius: 12px;
    background: rgba(70, 199, 181, 0.1);
    color: var(--primary);
  }

  .session-icon svg {
    width: 20px;
    height: 20px;
  }

  .session-panel > div:last-child {
    display: flex;
    min-width: 0;
    flex-direction: column;
  }

  .session-label {
    color: var(--muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

  .session-panel strong {
    margin-top: 2px;
    overflow: hidden;
    font-size: 14px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .session-panel div > span:last-child {
    margin-top: 2px;
    color: var(--muted);
    font-size: 12px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    margin-bottom: 9px;
    color: #c7d5d2;
    font-size: 12px;
    font-weight: 700;
  }

  input[type='text'] {
    width: 100%;
    min-height: 54px;
    padding: 0 16px;
    border: 1px solid var(--border-strong);
    border-radius: 13px;
    outline: none;
    background: rgba(4, 15, 14, 0.55);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.035em;
    transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
  }

  input[type='text']::placeholder {
    color: #617570;
  }

  input[type='text']:focus {
    border-color: var(--primary);
    background: rgba(8, 25, 23, 0.78);
    box-shadow: 0 0 0 4px rgba(70, 199, 181, 0.11);
  }

  .input-locked {
    border-color: var(--border) !important;
    background: rgba(3, 12, 11, 0.42) !important;
    color: var(--muted) !important;
    cursor: not-allowed;
  }

  .format-guide {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 7px 12px;
    margin-top: 11px;
    color: #7f9691;
    font-size: 10px;
  }

  .format-guide b {
    color: #c2d4d0;
    font-weight: 700;
  }

  button {
    display: inline-flex;
    width: 100%;
    min-height: 52px;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 13px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
  }

  button:focus-visible {
    outline: 3px solid rgba(70, 199, 181, 0.36);
    outline-offset: 3px;
  }

  button:disabled {
    cursor: wait;
    opacity: 0.7;
  }

  .btn-primary {
    background: linear-gradient(135deg, #55d2c0, #29998b);
    color: #031311;
    box-shadow: 0 12px 28px rgba(35, 139, 126, 0.2);
  }

  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 15px 32px rgba(35, 139, 126, 0.3);
  }

  .btn-secondary {
    margin-top: 10px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.035);
    color: #c5d3d0;
  }

  .btn-secondary:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.07);
  }

  .is-loading::before {
    width: 14px;
    height: 14px;
    margin-right: 9px;
    border: 2px solid rgba(3, 19, 17, 0.25);
    border-top-color: #031311;
    border-radius: 50%;
    animation: spin 700ms linear infinite;
    content: '';
  }

  .error-text {
    margin: -4px 0 16px;
    padding: 12px 13px;
    border: 1px solid rgba(255, 143, 136, 0.19);
    border-radius: 11px;
    background: rgba(255, 143, 136, 0.08);
    color: #ffaaa4;
    font-size: 12px;
    line-height: 1.45;
  }

  .policy-note {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin-top: 17px;
    color: #7e9691;
    font-size: 10px;
    line-height: 1.5;
  }

  .policy-note svg {
    flex: 0 0 16px;
    width: 16px;
    margin-top: 1px;
    color: var(--primary);
  }

  .profile-card {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 17px;
    background: var(--surface-raised);
  }

  .profile-avatar {
    display: grid;
    flex: 0 0 52px;
    width: 52px;
    height: 52px;
    place-items: center;
    border-radius: 15px;
    background: linear-gradient(145deg, var(--primary), var(--primary-dark));
    color: #041513;
    font-family: 'Manrope', sans-serif;
    font-size: 20px;
    font-weight: 800;
  }

  .profile-details {
    min-width: 0;
    flex: 1;
  }

  .profile-name {
    overflow: hidden;
    font-size: 16px;
    font-weight: 700;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .profile-roll {
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
  }

  .verified-icon {
    width: 23px;
    color: var(--success);
  }

  .status-icon {
    display: grid;
    width: 66px;
    height: 66px;
    margin: 0 auto 25px;
    place-items: center;
    border-radius: 20px;
  }

  .status-icon svg {
    width: 29px;
  }

  .status-icon-error {
    border: 1px solid rgba(255, 143, 136, 0.2);
    background: rgba(255, 143, 136, 0.08);
    color: var(--error);
  }

  .success-mark {
    width: 78px;
    margin: 0 auto 25px;
    color: var(--success);
  }

  .success-mark svg {
    display: block;
    overflow: visible;
    fill: rgba(106, 215, 168, 0.08);
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2.6;
  }

  .success-mark circle {
    stroke-dasharray: 152;
    stroke-dashoffset: 152;
    animation: draw-stroke 500ms ease-out forwards;
  }

  .success-mark path {
    stroke-dasharray: 38;
    stroke-dashoffset: 38;
    animation: draw-stroke 350ms 420ms ease-out forwards;
  }

  @keyframes draw-stroke {
    to { stroke-dashoffset: 0; }
  }

  .success-footer {
    margin-top: 16px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.025);
  }

  .page-footer {
    margin-top: 18px;
    color: #637974;
    font-size: 10px;
    letter-spacing: 0.07em;
    text-align: center;
    text-transform: uppercase;
  }

  .celebration-particle {
    position: fixed;
    z-index: 10;
    top: 42%;
    left: 50%;
    width: 7px;
    height: 11px;
    border-radius: 2px;
    pointer-events: none;
    animation: celebrate 1.5s var(--delay) cubic-bezier(0.16, 0.8, 0.3, 1) forwards;
  }

  @keyframes celebrate {
    from { opacity: 1; transform: translate(-50%, -50%) rotate(0); }
    to { opacity: 0; transform: translate(calc(-50% + var(--x)), var(--y)) rotate(var(--rotation)); }
  }

  .hidden {
    display: none !important;
  }

  @media (max-width: 420px) {
    body { padding-right: 12px; padding-left: 12px; }
    .brand-bar { margin-right: 5px; margin-left: 5px; }
    .secure-badge { font-size: 10px; }
    .app-card { padding: 27px 22px; border-radius: 23px; }
    .format-guide { grid-template-columns: 1fr; gap: 5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
