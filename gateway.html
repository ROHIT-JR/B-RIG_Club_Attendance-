<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B-RIG Attendance</title>
    <!-- Add standard favicon just in case -->
    <link rel="icon" href="https://avatars.githubusercontent.com/u/129193826?s=400&u=1fcd80a193fc7377208d6fb5a02686bcc8754f66&v=4">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%;
            overflow: hidden; 
            background: #0f0f14; 
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            /* Fix iframe height issues on mobile safari */
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            z-index: 10;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #00ffcc;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    
    <div id="loading">
        <div class="spinner"></div>
        <div style="font-weight: 500; letter-spacing: 1px; font-size: 14px; opacity: 0.8;">SECURING CONNECTION...</div>
    </div>

    <script>
        // Extract parameters passed from the Google Sheets QR Code generator
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const token = urlParams.get('session'); // The session token
        
        if (id) {
            // Construct the Apps Script Web App URL
            let scriptUrl = `https://script.google.com/macros/s/${id}/exec`;
            if (token) {
                scriptUrl += `?session=${token}`;
            }
            
            // Create and inject the iframe
            const iframe = document.createElement('iframe');
            
            // When the iframe finishes loading, hide our custom loading spinner
            iframe.onload = function() {
                const loader = document.getElementById('loading');
                if (loader) loader.style.display = 'none';
            };
            
            iframe.src = scriptUrl;
            document.body.appendChild(iframe);
        } else {
            document.getElementById('loading').innerHTML = `
                <div style="text-align: center;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ff4d4d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:15px;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <h2 style="margin:0; font-size: 18px;">Invalid QR Code</h2>
                    <p style="opacity: 0.6; font-size: 14px; margin-top: 8px;">Missing Script ID parameter.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
